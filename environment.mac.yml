# Local Mac development environment (Apple Silicon / MPS-friendly).
# Create from the repo root:
#   mamba env create -f environment.mac.yml
#   conda activate llm_isa_local
#
# Dependency pins (same SHAs to use on the DGX):
#   transformers            tag v5.6.2    commit aa935fb53dc38b56f10cc86b3a74354c2e99412f
#   lm-evaluation-harness   tag v0.4.11   commit 27988a293647d5853e48edea291640b4af54740c
#
# Not for DGX/CUDA — see environment.dgx_mustafa.yml for Mustafa's lab snapshot.

name: llm_isa_local
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - torch
      - accelerate
      - datasets
      - safetensors
      - sentencepiece
      - protobuf
      - -e ./transformers
      - -e ./lm-evaluation-harness
