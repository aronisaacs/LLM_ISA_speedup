# Local Mac development environment (Apple Silicon / MPS-friendly).
# Create from the repo root:
#   mamba env create -f environment.mac.yml
#   conda activate llm_isa_local
#
# Dependency pins (see deps_pins.txt):
#   transformers            fork aronisaacs/transformers           branch aron-edits  118d07b...
#   lm-evaluation-harness   fork aronisaacs/lm-evaluation-harness  branch aron-edits  27988a2... (v0.4.11)
#
# Not for DGX/CUDA — see environment.dgx_mustafa.yml for Mustafa's lab snapshot.

name: llm_isa_local
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - torch
      - accelerate
      - datasets
      - safetensors
      - sentencepiece
      - protobuf
      - -e ./transformers
      - -e ./lm-evaluation-harness
