# Local Mac development environment (Apple Silicon / MPS-friendly).
# Create from the repo root:
#   mamba env create -f env/environment.mac.yml
#   conda activate llm_isa_local
#
# Dependency pins (see env/deps_pins.txt):
#   transformers==5.6.2
#   lm-eval==0.4.11
#
# Not for DGX/CUDA — see env/environment.dgx_mustafa.yml for Mustafa's lab snapshot.

name: llm_isa_local
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - torch
      - accelerate
      - datasets
      - safetensors
      - sentencepiece
      - protobuf
      - transformers==5.6.2
      - lm-eval==0.4.11
