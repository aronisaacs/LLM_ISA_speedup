# LongBench-E passage_count: LongBench's prompt, truncated to 31,500 tokens as pred.py does (tr_prompts.py).
task: longbench_passage_count_e_tr
dataset_path: Xnhyacinth/LongBench
test_split: test
dataset_name: passage_count_e
doc_to_text: !function tr_prompts.passage_count
doc_to_target: '{{answers}}'
process_results: !function tr_metrics.get_count_with_score
generation_kwargs:
  max_gen_toks: 32
  temperature: 1
  do_sample: False
  until: []
metric_list:
  - metric: "score"
    aggregation: mean
    higher_is_better: True
  - metric: "count_score"
    aggregation: mean
    higher_is_better: True
metadata:
  version: 5.0
