# LongBench-E triviaqa: LongBench's prompt, truncated to 31,500 tokens as pred.py does (tr_prompts.py).
task: longbench_triviaqa_e_tr
dataset_path: Xnhyacinth/LongBench
test_split: test
dataset_name: triviaqa_e
doc_to_text: !function tr_prompts.triviaqa
doc_to_target: '{{answers}}'
target_delimiter: ""
process_results: !function tr_metrics.get_qa_f1_with_score
generation_kwargs:
  max_gen_toks: 32
  temperature: 1
  do_sample: False
  until: ["\n"]
metric_list:
  - metric: "score"
    aggregation: mean
    higher_is_better: True
  - metric: "qa_f1_score"
    aggregation: mean
    higher_is_better: True
metadata:
  version: 5.0
