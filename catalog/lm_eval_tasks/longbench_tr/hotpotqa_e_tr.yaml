# LongBench-E hotpotqa: LongBench's prompt, truncated to 31,500 tokens as pred.py does (tr_prompts.py).
task: longbench_hotpotqa_e_tr
dataset_path: Xnhyacinth/LongBench
test_split: test
dataset_name: hotpotqa_e
doc_to_text: !function tr_prompts.hotpotqa
doc_to_target: '{{answers}}'
process_results: !function tr_metrics.get_qa_f1_with_score
generation_kwargs:
  max_gen_toks: 32
  temperature: 1
  do_sample: False
  until: []
metric_list:
  - metric: "score"
    aggregation: mean
    higher_is_better: True
  - metric: "qa_f1_score"
    aggregation: mean
    higher_is_better: True
metadata:
  version: 5.0
