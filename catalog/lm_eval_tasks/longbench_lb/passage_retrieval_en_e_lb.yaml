# lm-eval's longbench_passage_retrieval_en_e with LongBench's own prompt (see lb_prompts.py).
task: longbench_passage_retrieval_en_e_lb
dataset_path: Xnhyacinth/LongBench
test_split: test
dataset_name: passage_retrieval_en_e
doc_to_text: !function lb_prompts.passage_retrieval_en
doc_to_target: '{{answers}}'
process_results: !function lb_metrics.get_retrieval_with_score
generation_kwargs:
  max_gen_toks: 32
  temperature: 1
  do_sample: False
  until: []
metric_list:
  - metric: "score"
    aggregation: mean
    higher_is_better: True
  - metric: "retrieval_score"
    aggregation: mean
    higher_is_better: True
metadata:
  version: 5.0
